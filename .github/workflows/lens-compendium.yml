name: Lens Intelligence Compendium
# Project Lens — 6-section daily intelligence package
# Model: Groq llama-3.3-70b (light synthesis + formatting)
# Schedule: 1x daily at 02:30 UTC = 10:30 PM Washington DC (EDT)
# Fires AFTER Regular Report (02:10 UTC)
# Cost: $0/run
# Guard: preflight + retry + failure alert

on:
  schedule:
    - cron: '30 2 * * *'  # 10:30 PM Washington DC (EDT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (no API call, no Telegram)'
        required: false
        default: 'false'

jobs:
  compendium:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            supabase \
            python-dotenv \
            requests \
            python-docx==1.1.2 \
            groq

      - name: Run Compendium
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python code/lens_compendium.py $DRY_RUN_FLAG
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GROQ_S2DGCOM_API_KEY: ${{ secrets.GROQ_S2DGCOM_API_KEY }}
          GITHUB_ACTIONS:       "true"
