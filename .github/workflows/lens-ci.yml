name: Lens CI
# Project Lens — build gate
# LENS-028 CC-1b
#
# Why this exists: TestRegistryAlignment (CC-1) can detect model-registry
# drift, but a test nobody runs is not a gate. On 2026-07-27 the guard's
# T25 test had been RED for weeks — asserting on ("cerebras","qwen-3-235b"),
# a model the guard no longer used — and nothing was reading its exit code.
# That is the same silent-corpse shape that let S2-D run dead for 10 days
# under green checks. This workflow gives those assertions a jaw.
#
# Every step fails the job on a non-zero exit. No step may be made advisory.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            supabase \
            python-dotenv \
            requests \
            openai \
            groq

      - name: Compile every module (LR-092)
        run: python -m py_compile code/*.py

      - name: Registry self-test (lens_models)
        run: python code/lens_models.py

      - name: Quota guard + registry alignment tests
        run: python tests/test_lens_quota_guard.py

      - name: Response schema validator tests (CC-79)
        run: python tests/test_lens_response_guard.py

      - name: S2-F provenance tests (CC-85)
        run: python tests/test_s2f_provenance.py

      - name: S2-F clarity write tests (CC-88)
        run: python tests/test_s2f_clarity_writes.py

      - name: S2-F watch + verification write tests (CC-89)
        run: python tests/test_s2f_aggregator_writes.py

      - name: S2-F error redaction tests (CC-92)
        run: python tests/test_s2f_error_redaction.py

      - name: S3-D window and label tests (CC-93)
        run: python tests/test_s3d_window.py

      - name: S2-F quota breaker tests (CC-97)
        run: python tests/test_s2f_quota_breaker.py
      - name: CC-120 S2-F Direction B sends a finding once until it changes (L3.4)
        run: python tests/test_s2f_delivery_rules.py
      - name: CC-122 S2-F Stage 1 picks long articles, one per source, oldest turn first
        run: python tests/test_s2f_selection.py
      - name: CC-124 messages are clipped at words, free of markdown, and truly labelled
        run: python tests/test_presentation.py

      - name: S3-A window tests (CC-99)
        run: python tests/test_s3a_window.py

      - name: S1 canary report is loud (CC-100)
        run: python tests/test_s1_report_loud.py

      - name: Five small truths (CC-101)
        run: python tests/test_cc101_small_truths.py

      - name: Provider refusal lines (CC-102)
        run: python tests/test_provider_refusal.py

      - name: Provider events are stored once, never raise (CC-103)
        run: python tests/test_provider_events.py

      - name: Groq and Cohere refusals are recorded (CC-104)
        run: python tests/test_provider_refusal_sites.py

      - name: Provider health message (CC-105)
        run: python tests/test_provider_health.py

      - name: A gone model is not retried (CC-106)
        run: python tests/test_gone_model_no_retry.py

      - name: S2 positions and MA record refusals (CC-107)
        run: python tests/test_provider_refusal_s2.py

      - name: S3-C window tests (CC-108)
        run: python tests/test_s3c_window.py

      - name: S3-F and Regular Report record refusals (CC-109)
        run: python tests/test_provider_refusal_s3.py

      - name: S3-D records refusals, nothing else changed (CC-110)
        run: python tests/test_s3d_refusal.py

      - name: Compendium guard is loud (CC-111)
        run: python tests/test_compendium_refusal.py

      - name: S3-D keeps its whole answer (CC-112)
        run: python tests/test_s3d_keeps_all.py

      - name: The canary breathes alone (CC-113)
        run: python tests/test_canary_air_alone.py

      - name: The canary's voice counts its lenses (CC-114)
        run: python tests/test_canary_voice.py

      - name: A retired provider is not called (CC-115)
        run: python tests/test_retired_provider.py

      - name: The alert says what changed (CC-116)
        run: python tests/test_alert_on_change.py

      - name: The S2 report is restored, loud and readable (CC-117)
        run: python tests/test_s2_report_loud.py

      - name: The S3 message holds hypotheses, not forecasts (CC-118)
        run: python tests/test_s3_hypothesis_voice.py

      - name: The S3 prompts ask for causes in motion, not forecasts (CC-119)
        run: python tests/test_s3_no_forecast.py
