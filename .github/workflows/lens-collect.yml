name: Lens Collection Pipeline
# Project Lens — 2x daily collection
# Runs at: 13:00 + 01:00 UTC (Washington D.C. EDT primary)
# 09:00 AM D.C. | 09:00 PM D.C.
# Collects from 77 sources (STATE + TIER1-3 + TIER_B + TIER_A)
# Matches indicators across 7 domains
# Ethics: public data only (LR-014(E))
# Updated: LENS-022
on:
  schedule:
    - cron: '0 13 * * *'   # 9:00 AM Washington D.C. (EDT)
    - cron: '0 1  * * *'   # 9:00 PM Washington D.C. (EDT)
  workflow_dispatch:        # Manual trigger
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            feedparser==6.0.12 \
            requests \
            supabase \
            python-dotenv \
            groq \
            tzdata
      - name: Run collection + injection detection
        run: |
          python code/fetch_text.py
          python code/lens_fetch_tierc.py || echo "Tier C non-fatal"
          python code/lens_fetch_tierd.py || echo "Tier D non-fatal"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_ACTIONS: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
