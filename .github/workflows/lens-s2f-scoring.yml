name: Lens S2-F Scoring Pipeline
# Project Lens — S2-F operations-based pretense detection
# LENS-020 | PHI-004 cognitive sovereignty cadence
#
# Runs AFTER collection (offset 30min from lens-collect.yml)
# Schedule: 13:30 and 01:30 UTC -- TWO crons, not four. The four-entry list
# written here was never true; the cron block below is the only schedule.
#
# Stage 1 (Watch)        — scores new articles, detects emerging patterns
# Stage 2 (Clarity)      — checks if Watch patterns persisted (daily)
# Stage 3 (Verification) — HIGH confidence findings (daily)
# Direction B            — delivers HIGH findings to operator via Telegram

on:
  schedule:
    - cron: '30 13 * * *'  # 9:30 AM DC EDT
    - cron: '30 1  * * *'  # 9:30 PM DC EDT
  workflow_dispatch:

jobs:
  s2f_scoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            supabase \
            python-dotenv \
            cerebras-cloud-sdk \
            openai \
            groq \
            requests

      - name: Stage 1 — Score new articles (Watch)
        run: python code/lens_s2f_scoring_cron.py
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_SERVICE_KEY }}
          CEREBRAS_API_KEY:         ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_API_TOKEN:     ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:    ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_ACTIONS:           "true"
          S2F_LENSES:               "xi_office,trump_office,khamenei_office"
          S2F_LOOKBACK_HOURS:       "6"
          S2F_MAX_ARTICLES:         "8"

      - name: Stage 1 — Watch aggregator
        run: python code/lens_s2f_watch_aggregator.py
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_ACTIONS:           "true"

      - name: Stage 2 — Clarity aggregator
        run: python code/lens_s2f_clarity_aggregator.py
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_ACTIONS:           "true"

      - name: Stage 3 — Verification aggregator
        run: python code/lens_s2f_verification_aggregator.py
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_ACTIONS:           "true"
          # CC-90: S2F_PROVIDER, MISTRAL_API_KEY and MISTRAL_MODEL were read by
          # nothing. lens_s2f_verification_aggregator.py imports only supabase
          # and dotenv and calls no model; the run contacted no Mistral host.
          # MISTRAL_API_KEY is Lens 4's key -- canary air handed to a step that
          # never breathed it. Verification is arithmetic over rows by charter
          # (see its docstring and PHI-004); it does not want an LLM. Deleted
          # rather than wired. mistral-small-latest is also an alias (D-015)
          # and 429s class-wide, so wiring it as written would fail at once.

      - name: Direction B — Deliver HIGH findings to operator
        run: python code/lens_s2f_direction_b.py
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS:           "true"
