name: Lens Manager + Analyze
on:
  schedule:
    - cron: '28 13 * * *'
    - cron: '28 1  * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if budget exhausted (LENS_FORCE=1)'
        required: false
        default: 'false'
      dry_run:
        description: 'Dry run — pre-flight only, no lenses fire (LENS_DRY_RUN=1)'
        required: false
        default: 'false'

jobs:
  manage-and-analyze:
    runs-on: ubuntu-latest
    # LENS-028: this job had NO timeout at all, relying on GitHub's unset-job
    # default. Observed runs are 16-18 min; the Cerebras migration adds ~4 min
    # of S2-E spacing. 35 leaves room for that plus a slow provider.
    # Set deliberately because the TPM governor contained a loop that could
    # never terminate (CC-1c fixed it) -- an unbounded job plus a guard that
    # can hang burns hours of Actions minutes before anyone notices.
    # CC-82 (LENS-042): the 2026-09-17 evening wave was cancelled at 35m with
    # S3-D mid-call -- S3-C on Cohere took 394s that night. Successful waves
    # run 27-30m, so the margin was ~5m on a Mon/Thu when S3-C and S3-D both
    # run. GitHub allows 6h per job; 50m keeps the wave loud, not truncated.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv groq supabase google-genai cerebras-cloud-sdk httpx openai tzdata openpyxl cohere python-docx lxml

      - name: Run Lens Orchestrator (pre-flight + sequential analysis)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MA_API_KEY: ${{ secrets.GROQ_MA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LENS_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          LENS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          python code/lens_orchestrator.py
          python code/lens_s1_report.py   # CC-100: no `|| true` -- a missing canary report is a red step
          echo "System 1 complete — proceeding to System 2"

      - name: Run System 2 Orchestrator (injection + coordination + emotion + adversary + legitimacy + mission analyst)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_S2_API_KEY: ${{ secrets.GROQ_S2_API_KEY }}
          GROQ_S2A_API_KEY: ${{ secrets.GROQ_S2A_API_KEY }}
          GROQ_S2DGCOM_API_KEY: ${{ secrets.GROQ_S2DGCOM_API_KEY }}
          GROQ_MA_API_KEY: ${{ secrets.GROQ_MA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_S2B_API_KEY: ${{ secrets.GEMINI_S2B_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GROQ_S2E_API_KEY: ${{ secrets.GROQ_S2E_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python code/lens_s2_orchestrator.py
          echo "System 2 complete"
      - name: Run System 3 Orchestrator (pattern intelligence + true history + long-term research)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_S2_API_KEY: ${{ secrets.GROQ_S2_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_S3B_API_KEY: ${{ secrets.GEMINI_S3B_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_S3_API_KEY: ${{ secrets.GROQ_S3_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python code/lens_s3_orchestrator.py
          echo "System 3 complete"
